name: Build ScaleBridge APK

# Runs on GitHub's hosted runner instead of a local machine, since local Group Policy blocks the
# Android workload installer's dotnet.exe subprocess (see docs/PROTOCOL_CONFIRMATION.md).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Android workload
        run: dotnet workload restore src/ScaleBridge/ScaleBridge.csproj

      - name: Prepare signing keystore
        # Prefers a persisted keystore stored in the ANDROID_KEYSTORE_BASE64 repo secret (set up
        # once via the "Generate persistent signing keystore" workflow - see docs/SETUP.md), so
        # every build is signed with the same key and installs cleanly as an update over the
        # previous one. Falls back to generating a fresh throwaway keystore, purely so this
        # workflow still works out of the box before that one-time setup is done - but every build
        # signed that way requires uninstalling the previous copy first (Android refuses to
        # install an update signed by a different key), which is easy to do by accident and looks
        # like "the fix didn't work" when it's actually just testing a stale install.
        shell: pwsh
        run: |
          $encoded = "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          if ([string]::IsNullOrWhiteSpace($encoded)) {
            Write-Warning "ANDROID_KEYSTORE_BASE64 repo secret is not set - generating a THROWAWAY keystore for this run only. Uninstall any previous ScaleBridge install before installing this build, or set up a persisted keystore (see docs/SETUP.md) to avoid this every time."
            keytool -genkeypair -v `
              -keystore scalebridge.keystore `
              -alias scalebridge `
              -keyalg RSA -keysize 2048 -validity 10000 `
              -storepass "scalebridge-test" -keypass "scalebridge-test" `
              -dname "CN=ScaleBridge Test, OU=Test, O=Test, L=Test, S=Test, C=GB"
          } else {
            [IO.File]::WriteAllBytes("scalebridge.keystore", [Convert]::FromBase64String($encoded))
          }

      - name: Publish signed Release APK
        run: >
          dotnet publish src/ScaleBridge/ScaleBridge.csproj
          -f net10.0-android -c Release
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=${{ github.workspace }}\scalebridge.keystore
          -p:AndroidSigningKeyAlias=scalebridge
          -p:AndroidSigningKeyPass=scalebridge-test
          -p:AndroidSigningStorePass=scalebridge-test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScaleBridge-apk
          path: src/ScaleBridge/bin/Release/**/*-Signed.apk
          if-no-files-found: error

      - name: Dump generated Health Connect binding source (diagnostic)
        # Every Health Connect crash so far (see docs/PROTOCOL_CONFIRMATION.md) came from guessing
        # what the .NET binding generator actually calls a given Kotlin type/method, since that
        # can only otherwise be confirmed by running on a real device. The binding generator
        # writes its generated C# source for AndroidMavenLibrary references (like connect-client)
        # to disk under obj/ as a normal build side effect - this copies out whatever it generated
        # that mentions Health Connect, so it can be inspected directly instead of guessed at.
        # Always runs (even if the build/publish step above failed), since obj/ may still be
        # partially populated and useful.
        if: always()
        shell: pwsh
        run: |
          $dest = "health-connect-binding-dump"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null

          $files = Get-ChildItem -Path src/ScaleBridge/obj -Recurse -Include *.cs -ErrorAction SilentlyContinue |
            Select-String -Pattern "Health\.Connect" -List -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Path -Unique

          if ($files) {
            $i = 0
            foreach ($f in $files) {
              $i++
              Copy-Item -LiteralPath $f -Destination (Join-Path $dest "$i`_$(Split-Path $f -Leaf)") -Force
            }
            "Copied $($files.Count) generated source file(s) mentioning 'Health.Connect'." | Out-File (Join-Path $dest "_SUMMARY.txt")
          } else {
            "No generated .cs files under src/ScaleBridge/obj mentioned 'Health.Connect'. Either binding source isn't written under obj/ for AndroidMavenLibrary references on this SDK version, or it uses a different naming pattern - the obj tree structure itself may still be worth browsing manually from a downloaded full obj dump." | Out-File (Join-Path $dest "_SUMMARY.txt")
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-connect-binding-dump
          path: health-connect-binding-dump/**
          if-no-files-found: warn
