name: Generate persistent signing keystore (run once)

# One-off, manually-triggered workflow: generates a real Android signing keystore on the same
# GitHub-hosted runner used for real builds (so it has the same `keytool` availability already
# proven by build-apk.yml), base64-encodes it, and uploads it as a downloadable artifact - it is
# never printed to the workflow log.
#
# Run this once, download the resulting `scalebridge-keystore-base64` artifact, then add its
# contents as a repository secret named ANDROID_KEYSTORE_BASE64 (Settings -> Secrets and
# variables -> Actions -> New repository secret). Once that secret exists, build-apk.yml will use
# it automatically instead of generating a fresh throwaway keystore on every run - see
# docs/SETUP.md for the full walkthrough and why this matters (Android refuses to install an
# update signed by a different key than the one already installed).
#
# The keystore/key passwords and alias here are deliberately plain, fixed, non-secret values (this
# is a small personal sideloaded app, not something published where keystore compromise is a real
# risk) - only the keystore *file* itself needs to be kept as a secret, since unlike the
# passwords/alias it can't just be re-typed if lost.
on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Android workload
        # Same as build-apk.yml: this is what actually makes `keytool` available on PATH on a
        # plain windows-latest runner.
        run: dotnet workload restore src/ScaleBridge/ScaleBridge.csproj

      - name: Generate keystore and base64-encode it
        shell: pwsh
        run: |
          keytool -genkeypair -v `
            -keystore scalebridge.keystore `
            -alias scalebridge `
            -keyalg RSA -keysize 2048 -validity 10000 `
            -storepass "scalebridge-test" -keypass "scalebridge-test" `
            -dname "CN=ScaleBridge, OU=Personal, O=Personal, L=Personal, S=Personal, C=GB"
          [Convert]::ToBase64String([IO.File]::ReadAllBytes("scalebridge.keystore")) |
            Out-File -Encoding ascii -NoNewline scalebridge.keystore.base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: scalebridge-keystore-base64
          path: scalebridge.keystore.base64.txt
          if-no-files-found: error
